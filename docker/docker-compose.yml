# ============ 全局配置 ============
# 日志轮转：限制单容器日志大小，防止磁盘占满
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# 健康检查模板（各服务覆盖端口与 start_period）
x-healthcheck: &default-healthcheck
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 30s

services:
  main-client:
    build:
      context: ./main-client
      dockerfile: Dockerfile
    container_name: main-client
    ports:
      - "9000:9000"
    environment:
      - PORT=9000
      - ESP32P4_IP=10.137.119.21
      - ESP32P4_PORT=80
      - CAMERA_CAPTURE_HOST=host.docker.internal
      - CAMERA_CAPTURE_PORT=9007
      - FOCUS_URL=http://focus-detector:9003
      - EMOTION_URL=http://emotion-detector:9004
      - FATIGUE_URL=http://fatigue-detector:9005
      - FACE_DETECTOR_URL=http://face-detector:9006
      - GESTURE_MANTIS_URL=http://gesture-mantis-detector:9009
      - POSE_URL=http://pose-detector:9010
      - FACE_LANDMARKER_URL=http://face-landmarker:9011
      - FACE_POSITION_URL=http://face-position:9012
      - VLM_VISUAL_QA_URL=http://vlm-visual-qa:9013
      - VLM_GAME_DETECTOR_URL=http://vlm-game-detector:9014
      - VLM_POINTING_HOLD_THRESHOLD=1.5
      - VLM_GAME_SAMPLE_INTERVAL=10
      - WEBSOCKET_PING_INTERVAL=5
      - WEBSOCKET_PING_TIMEOUT=10
      - WEBSOCKET_CLOSE_TIMEOUT=5
      - INPUT_SOURCE=esp32p4
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    tmpfs:
      - /tmp
    mem_limit: 512m
    cpus: "1.0"
    logging: *default-logging
    healthcheck:
      <<: *default-healthcheck
      start_period: 10s
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:9000/', timeout=3)"]

  camera-capture:
    build:
      context: ./camera-capture
      dockerfile: Dockerfile
    container_name: camera-capture
    ports:
      - "9007:9007"
    environment:
      - PORT=9007
      - CAMERA_INDEX=0
      - FPS=30
      - JPEG_QUALITY=80
    restart: unless-stopped
    tmpfs:
      - /tmp
    mem_limit: 512m
    cpus: "1.0"
    logging: *default-logging
    healthcheck:
      <<: *default-healthcheck
      start_period: 10s
      test: ["CMD", "python", "-c", "import socket;socket.create_connection(('127.0.0.1', 9007), timeout=3)"]
    profiles:
      - camera

  # ============ 算法服务 ============
  # 说明：算法容器仅通过 docker 内部网络被 main-client 访问，无需发布端口到宿主机。
  # 如需在宿主机调试某个算法，可临时给该服务加 ports 映射。

  focus-detector:
    build:
      context: ./algorithms/focus
      dockerfile: Dockerfile
    container_name: focus-detector
    environment:
      - PORT=9003
      - WINDOW_DURATION=90
    restart: unless-stopped
    tmpfs:
      - /tmp
    mem_limit: 2g
    cpus: "2.0"
    logging: *default-logging
    healthcheck:
      <<: *default-healthcheck
      start_period: 60s
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:9003/health', timeout=3)"]

  emotion-detector:
    build:
      context: ./algorithms/emotion
      dockerfile: Dockerfile
    container_name: emotion-detector
    environment:
      - PORT=9004
    volumes:
      - model-cache:/root/.onnx
    restart: unless-stopped
    tmpfs:
      - /tmp
    mem_limit: 2g
    cpus: "2.0"
    logging: *default-logging
    healthcheck:
      <<: *default-healthcheck
      start_period: 60s
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:9004/health', timeout=3)"]

  fatigue-detector:
    build:
      context: ./algorithms/fatigue
      dockerfile: Dockerfile
    container_name: fatigue-detector
    environment:
      - PORT=9005
    volumes:
      - model-cache:/root/.dlib
    restart: unless-stopped
    tmpfs:
      - /tmp
    mem_limit: 1g
    cpus: "1.0"
    logging: *default-logging
    healthcheck:
      <<: *default-healthcheck
      start_period: 30s
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:9005/health', timeout=3)"]

  face-detector:
    build:
      context: ./algorithms/face-detector
      dockerfile: Dockerfile
    container_name: face-detector
    environment:
      - PORT=9006
    volumes:
      - model-cache:/root/.onnx
    restart: unless-stopped
    tmpfs:
      - /tmp
    mem_limit: 512m
    cpus: "1.0"
    logging: *default-logging
    healthcheck:
      <<: *default-healthcheck
      start_period: 30s
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:9006/health', timeout=3)"]

  gesture-mantis-detector:
    build:
      context: ./algorithms/gesture-mantis
      dockerfile: Dockerfile
    container_name: gesture-mantis-detector
    environment:
      - PORT=9009
    volumes:
      - model-cache:/root/.onnx
    restart: unless-stopped
    tmpfs:
      - /tmp
    mem_limit: 1g
    cpus: "1.5"
    logging: *default-logging
    healthcheck:
      <<: *default-healthcheck
      start_period: 30s
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:9009/health', timeout=3)"]

  pose-detector:
    build:
      context: ./algorithms/pose-detector
      dockerfile: Dockerfile
    container_name: pose-detector
    environment:
      - PORT=9010
    restart: unless-stopped
    tmpfs:
      - /tmp
    mem_limit: 1g
    cpus: "1.5"
    logging: *default-logging
    healthcheck:
      <<: *default-healthcheck
      start_period: 30s
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:9010/health', timeout=3)"]

  face-landmarker:
    build:
      context: ./algorithms/face-landmarker
      dockerfile: Dockerfile
    container_name: face-landmarker
    environment:
      - PORT=9011
    restart: unless-stopped
    tmpfs:
      - /tmp
    mem_limit: 1g
    cpus: "1.5"
    logging: *default-logging
    healthcheck:
      <<: *default-healthcheck
      start_period: 30s
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:9011/health', timeout=3)"]

  face-position:
    build:
      context: ./algorithms/face-position
      dockerfile: Dockerfile
    container_name: face-position
    environment:
      - PORT=9012
    restart: unless-stopped
    tmpfs:
      - /tmp
    mem_limit: 1g
    cpus: "1.5"
    logging: *default-logging
    healthcheck:
      <<: *default-healthcheck
      start_period: 30s
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:9012/health', timeout=3)"]

  vlm-visual-qa:
    build:
      context: ./algorithms
      dockerfile: vlm-visual-qa/Dockerfile
    container_name: vlm-visual-qa
    environment:
      - PORT=9013
      - ARK_API_KEY=${ARK_API_KEY:?请在 docker/.env 中配置 ARK_API_KEY}
      - VLM_MODEL_ENDPOINT=doubao-seed-2-0-mini-260428
      - VLM_BASE_URL=https://ark.cn-beijing.volces.com/api/v3
      - JPEG_QUALITY=50
      - MAX_IMAGE_WIDTH=640
    restart: unless-stopped
    tmpfs:
      - /tmp
    mem_limit: 512m
    cpus: "0.5"
    logging: *default-logging
    healthcheck:
      <<: *default-healthcheck
      start_period: 30s
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:9013/health', timeout=3)"]

  vlm-game-detector:
    build:
      context: ./algorithms
      dockerfile: vlm-game-detector/Dockerfile
    container_name: vlm-game-detector
    environment:
      - PORT=9014
      - ARK_API_KEY=${ARK_API_KEY:?请在 docker/.env 中配置 ARK_API_KEY}
      - VLM_MODEL_ENDPOINT=doubao-seed-2-0-mini-260428
      - VLM_BASE_URL=https://ark.cn-beijing.volces.com/api/v3
      - JPEG_QUALITY=50
      - MAX_IMAGE_WIDTH=640
      - TRIGGER_COOLDOWN=10
    restart: unless-stopped
    tmpfs:
      - /tmp
    mem_limit: 2g
    cpus: "2.0"
    logging: *default-logging
    healthcheck:
      <<: *default-healthcheck
      start_period: 120s
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:9014/health', timeout=3)"]

volumes:
  model-cache:
    driver: local
